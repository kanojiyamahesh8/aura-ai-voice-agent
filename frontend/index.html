<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Skincare — AI Voice Support</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Aura Skincare</h1>
        <p>AI Customer Support</p>
    </header>


    <main>

        <!-- Call Controls -->
        <section id="call-section">

            <h2>Voice Support</h2>

            <p id="status">
                Ready to start a call
            </p>

            <button id="startCall">
                Start Call
            </button>

            <button id="endCall" disabled>
                End Call
            </button>

        </section>


        <!-- Test Orders -->
        <section id="orders-section">

            <h2>Test Orders</h2>

            <div id="orders-container">
                <!-- Order cards are generated dynamically by JavaScript -->
            </div>

        </section>


        <!-- Call Transcript -->
        <section id="transcript-section">

            <h2>Call Transcript</h2>

            <div id="transcript">
                <p>No conversation yet.</p>
            </div>

        </section>


        <!-- Call Summary -->
        <section id="summary-section">

            <h2>Call Summary</h2>

            <div id="call-summary">

                <p>
                    <strong>Customer Intent:</strong>
                    <span id="customer-intent">—</span>
                </p>

                <p>
                    <strong>Order ID:</strong>
                    <span id="summary-order-id">—</span>
                </p>

                <p>
                    <strong>Resolution Status:</strong>
                    <span id="resolution-status">—</span>
                </p>

                <p>
                    <strong>Summary:</strong>
                    <span id="summary-text">—</span>
                </p>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
